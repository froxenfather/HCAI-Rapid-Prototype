services:
  - type: web
    name: caringbridge-ai-backend
    runtime: python
    rootDir: ai
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: AI_PROVIDER
        value: gemini
      - key: APP_ENV
        value: production
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_TEMPERATURE
        value: "0.4"
      - key: GEMINI_API_KEY
        sync: false
